<div class="films-page">

  <ng-container *ngIf="isLoading$ | async">
    <div class="loading-container">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  </ng-container>

  <ng-container *ngIf="(error$ | async) as error">
    <div *ngIf="error" class="error-container">
      <p class="error-message">Não foi possível carregar os filmes. Tente novamente.</p>
      <button mat-raised-button color="primary" (click)="retry()">Tentar novamente</button>
    </div>
  </ng-container>

  <ng-container *ngIf="!(isLoading$ | async) && !(error$ | async)">
    <div class="films-grid">
      <ng-container *ngIf="films$ | async as films">
        <mat-card *ngFor="let film of films" class="film-card">
          <mat-card-header>
            <mat-card-title>
              Episódio {{ film.episode_id }}: {{ film.title }}
            </mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <p><strong>Diretor:</strong> {{ film.director }}</p>
            <p><strong>Data de lançamento:</strong> {{ film.release_date }}</p>
          </mat-card-content>
        </mat-card>
      </ng-container>
    </div>
  </ng-container>

</div>
